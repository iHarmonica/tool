#_preseed_V1
# ==============================================================================
# 配置文件：Debian Trixie (Debian 13) 全盲盒全自动重装定制脚本
# 适用环境：阿里云等云服务器 (支持自动IP/DHCP)
# 核心特性：无SWAP分区、全盘单分区、极速Xtom源、预装常用运维工具、全面系统性能魔改
# ==============================================================================

### 1. 语言与中文支持 (Localization)
# ------------------------------------------------------------------------------
# 默认系统内部语言使用英文，防止终端报错时乱码
d-i debian-installer/locale string en_US.UTF-8
# 额外生成中文环境支持，开启中文 SSH 支持，防止中文文件名或日志显示乱码
d-i localechooser/supported-locales multiselect en_US.UTF-8, zh_CN.UTF-8
# 设定标准美式键盘映射
d-i keyboard-configuration/xkb-keymap select us


### 2. 网络配置 (Network configuration)
# ------------------------------------------------------------------------------
# 自动选择有网络信号的物理网卡联网 (DHCP 自动获取 IP)
d-i netcfg/choose_interface select auto
# 强制设定系统主机名为 localhost，domain 设定为空字符串
d-i netcfg/get_hostname string localhost
d-i netcfg/get_domain string ""
# 禁用无线网络 WEP 弹窗提示
d-i netcfg/wireless_wep string


### 3. 镜像软件源设置 (Mirror settings)
# ------------------------------------------------------------------------------
# 手动指定远程镜像源
d-i mirror/country string manual
# 使用高性能的 xTom 香港镜像源，确保全球及亚洲 VPS 都能极速完成重装
d-i mirror/http/hostname string mirror.xtom.com.hk
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string


### 4. 账户与密码设置 (Account setup)
# ------------------------------------------------------------------------------
# 开启并允许超级管理员 Root 登录
d-i passwd/root-login boolean true
# 禁用普通用户创建，保持系统精简纯净，仅留 Root 账户
d-i passwd/make-user boolean false
# 设定超级管理员正式密码为：PassWord
d-i passwd/root-password password PassWord
d-i passwd/root-password-again password PassWord


### 5. 时钟与时区设置 (Clock and time zone)
# ------------------------------------------------------------------------------
# 硬件时钟使用万能的 UTC 时间（与绝大多数 VPS 母鸡硬件保持时线一致）
d-i clock-setup/utc boolean true
# 时区设定为中国标准时区
d-i time/zone string Asia/Shanghai
# 开启网络时间协议 (NTP) 自动对时
d-i clock-setup/ntp boolean true


### 6. 磁盘分区：全盘删除，禁止物理 SWAP (Partitioning)
# ------------------------------------------------------------------------------
# 采用标准的常规分区模式，不引入复杂的 LVM 卷组
d-i partman-auto/method string regular
# 强行擦除旧硬盘残留的 LVM 卷组与多路径磁盘数据，防止重装挂起
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
# 【无SWAP魔改方案】设定单分区配方，强制将 swap 最大值设为 0，让根目录(/)吃满 100% 空间
d-i partman-auto/expert_recipe string \
    noswap :: \
        1000 50 1000000000 ext4 \
            $primary{ } $bootable{ } \
            method{ format } format{ } \
            use_filesystem{ } filesystem{ ext4 } \
            mountpoint{ / } \
        .
# 应用自定义的 noswap 方案并执行完全免确认覆盖
d-i partman-auto/choose_recipe select noswap
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true


### 7. 底层与预装软件选择 (Package selection)
# ------------------------------------------------------------------------------
# 禁用本地光盘检测
d-i apt-setup/cdrom/set-first boolean false
# 允许安装非开源固件驱动，规避某些独立服务器因缺失网卡驱动导致失联的风险
d-i apt-setup/non-free-firmware boolean true
# 精简系统组件：仅勾选标准系统环境与基本的 SSH 服务（拒绝任何桌面污染）
tasksel tasksel/first multiselect standard, ssh-server
# 一步到位预装你指定的常用运维工具、Nginx、Certbot 以及 ZRAM 驱动
d-i pkgsel/include string openssh-server sudo curl wget vim unzip zip htop tmux tree lsof nginx certbot python3-certbot-nginx whois cron mtr-tiny iputils-ping procps socat zram-tools
# 安装过程中顺便将所有包升级至最新稳定版本
d-i pkgsel/upgrade select full-upgrade


### 8. 引导程序安装 (Boot loader)
# ------------------------------------------------------------------------------
# 自动将 GRUB 引导主程序安装至默认主硬盘中
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default


### 9. 结束安装并重启 (Finishing up)
# ------------------------------------------------------------------------------
# 安装完成后不暂停提示，直接进行冷重启，无缝切换到新系统
d-i finish-install/reboot_in_progress note


### 10. 高级后置脚本：系统级魔改与生产环境调优 (Custom commands)
# ------------------------------------------------------------------------------
# 在重启进入新系统前的临界点，通过 chroot (in-target) 写入所有高级配置。
# 所有的命令经过了严格的转义（如 \$PATH），确保完美兼容阿里云的环境变量缺失问题。
d-i preseed/late_command string in-target sh -c '\
    # [1] 强制开启 SSH 的 Root 密码远程登录认证 \
    sed -i "s/^#\?PermitRootLogin .*/PermitRootLogin yes/" /etc/ssh/sshd_config; \
    sed -i "s/^#\?PasswordAuthentication .*/PasswordAuthentication yes/" /etc/ssh/sshd_config; \
    \
    # [2] 强刷系统主机名与 Hosts 映射为 localhost \
    echo "localhost" > /etc/hostname; \
    sed -i "s/127.0.1.1.*/127.0.1.1\tlocalhost/" /etc/hosts; \
    \
    # [3] 修复并终根治阿里云等特定厂商 root 环境变量路径不全的顽疾 \
    echo "" >> /root/.bashrc; \
    echo "export PATH=\$PATH:/usr/local/sbin:/usr/sbin:/sbin" >> /root/.bashrc; \
    \
    # [4] 注入 TCP BBR 拥塞控制算法及 Fast Open 性能调优（文件形式写入，开机自启自动生效） \
    echo "net.core.default_qdisc=fq" >> /etc/sysctl.d/99-bbr.conf; \
    echo "net.ipv4.tcp_congestion_control=bbr" >> /etc/sysctl.d/99-bbr.conf; \
    echo "net.ipv4.tcp_fastopen=3" >> /etc/sysctl.d/99-bbr.conf; \
    \
    # [5] 启用 ZRAM 虚拟内存，并将 swappiness 设为 100 保证高压缩比内存无缝置换 \
    systemctl enable zramswap; \
    echo "vm.swappiness=100" > /etc/sysctl.d/99-swappiness.conf; \
    \
    # [6] 严格限制 systemd 运行日志的最大体积，防止长期运行撑爆云盘 \
    sed -i -e "s|#SystemMaxUse=.*|SystemMaxUse=128M|" \
           -e "s|#RuntimeMaxUse=.*|RuntimeMaxUse=64M|" \
           -e "s|#MaxRetentionSec=.*|MaxRetentionSec=1week|" \
           /etc/systemd/journald.conf'

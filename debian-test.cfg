#_preseed_V1
# 针对 Debian Trixie (Debian 13) 全盲盒自动重装定制配置

### 1. 语言与中文支持 (Localization)
# 默认系统语言设为英文（推荐，防止终端报错乱码）
d-i debian-installer/locale string en_US.UTF-8
# 额外生成中文环境支持（开启中文 SSH 支持，防止中文文件名、日志乱码）
d-i localechooser/supported-locales multiselect en_US.UTF-8, zh_CN.UTF-8
# 设定标准美式键盘映射
d-i keyboard-configuration/xkb-keymap select us

### 2. 静态网络配置 (Manual Network configuration)
# 禁用网络自动配置 (关闭 DHCP)，强制开启手动静态 IP 配置
d-i netcfg/disable_autoconfig boolean true

# 自动选择有网络信号的网卡绑定静态 IP
d-i netcfg/choose_interface select auto

# 注入你提供的静态 IPv4 网络参数
d-i netcfg/get_ipaddress string 154.31.157.121
d-i netcfg/get_netmask string 255.255.255.0
d-i netcfg/get_gateway string 154.31.157.1
# 设定公共 DNS 站（不设 DNS 会导致后续无法下载 xTom 的镜像源）
d-i netcfg/get_nameservers string 1.1.1.1 8.8.8.8

# 确认使用上述静态 IP 配置，不弹出确认窗口
d-i netcfg/confirm_static boolean true

# 设置主机名为 localhost
d-i netcfg/get_hostname string localhost
d-i netcfg/get_domain string local

### 3. 软件源设置 (Mirror settings)
# 手动指定镜像源
d-i mirror/country string manual
# 使用你指定的 xTom 香港高性能镜像源（适合亚洲及全球大部分 VPS 极速下载）
d-i mirror/http/hostname string mirror.xtom.com.hk
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### 4. 账户与密码设置 (Account setup)
# 允许 Root 登录
d-i passwd/root-login boolean true
# 禁用普通用户创建，精简系统只留 Root
d-i passwd/make-user boolean false
# 设定你要求的 Root 密码：PassWord
d-i passwd/root-password password PassWord
d-i passwd/root-password-again password PassWord

### 5. 时钟与时区设置 (Clock and time zone)
# 硬件时钟使用 UTC 时间
d-i clock-setup/utc boolean true
# 时区设定为 UTC（跟随绝大多数海外云厂商 VPS 的默认母鸡时区）
d-i time/zone string UTC
# 开启网络时间同步
d-i clock-setup/ntp boolean true

### 6. 磁盘分区：全盘删除，禁止物理 SWAP (Partitioning)
d-i partman-auto/method string regular
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-auto/expert_recipe string \
    noswap :: \
        1000 50 1000000000 ext4 \
            $primary{ } $bootable{ } \
            method{ format } format{ } \
            use_filesystem{ } filesystem{ ext4 } \
            mountpoint{ / } \
        .
d-i partman-auto/choose_recipe select noswap
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

### 7. 底层与基础软件包选择 (Package selection)
# 禁用光盘检测
d-i apt-setup/cdrom/set-first boolean false
# 允许安装非开源固件驱动（避免某些独立服务器缺少网卡驱动失联）
d-i apt-setup/non-free-firmware boolean true
# 只安装标准系统组件和 SSH 服务器（不装任何桌面，极度纯净）
tasksel tasksel/first multiselect standard, ssh-server
# 追加云服务器必备的常用小工具
d-i pkgsel/include string openssh-server curl wget vim tmux sudo
# 在安装过程中顺便将所有软件包更新到最新安全版本
d-i pkgsel/upgrade select full-upgrade

### 8. 引导程序安装 (Boot loader)
# 自动将 GRUB 引导程序写入硬盘
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
# 强制让系统注入到默认主硬盘，防止被其他挂载盘干扰
d-i grub-installer/bootdev string default

### 9. 结束安装并重启 (Finishing up)
# 跳过“安装完成，请拔掉光盘”的提示，直接冷重启进入新系统
d-i finish-install/reboot_in_progress note

### 10. 高级后置脚本：开启 SSH Root 密码登录 (Custom commands)
# 核心盲装补丁：Debian 默认禁止 SSH 远程用 Root 密码登录。
# 下面这一行命令会在重装完、重启前的临界点，强行修改新系统的 sshd_config，允许 Root 登录和密码认证。
d-i preseed/late_command string in-target sed -i 's/^#\?PermitRootLogin .*/PermitRootLogin yes/' /etc/ssh/sshd_config; in-target sed -i 's/^#\?PasswordAuthentication .*/PasswordAuthentication yes/' /etc/ssh/sshd_config

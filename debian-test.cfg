#_preseed_V1
# ==============================================================================
# 配置文件：Debian Trixie (Debian 13) 全盲盒全自动重装定制脚本 (静态 IP 专用版)
# 适用环境：阿里云、腾讯云、搬瓦工(BW)等云服务器 (或需要手动指定静态网络的环境)
# 核心特性：无SWAP分区、全盘单分区、极速Xtom源、预装常用运维工具、全面系统性能魔改
# ==============================================================================

### 1. 语言与中文支持 (Localization)
# ------------------------------------------------------------------------------
# 默认系统内部语言使用英文，防止终端报错时乱码
d-i debian-installer/locale string en_US.UTF-8
# 额外生成中文环境支持，开启中文 SSH 支持，防止中文文件名或日志显示乱码
d-i localechooser/supported-locales multiselect en_US.UTF-8, zh_CN.UTF-8
# 设定标准美式键盘映射
d-i keyboard-configuration/xkb-keymap select us


### 2. 网络配置 (Network configuration)
# ------------------------------------------------------------------------------
# 禁用网络自动配置 (关闭 DHCP)，强制开启手动静态 IP 配置
d-i netcfg/disable_autoconfig boolean true
# 自动选择有网络信号的物理网卡绑定静态 IP
d-i netcfg/choose_interface select auto

# 注入你指定的静态 IPv4 网络参数
d-i netcfg/get_ipaddress string 154.31.157.121
d-i netcfg/get_netmask string 255.255.255.0
d-i netcfg/get_gateway string 154.31.157.1
# 设定公共 DNS（不设 DNS 会导致后续无法下载 xTom 的镜像源）
d-i netcfg/get_nameservers string 1.1.1.1 8.8.8.8
# 确认使用上述静态 IP 配置，不弹出确认窗口
d-i netcfg/confirm_static boolean true

# 强制设定系统主机名为 localhost
d-i netcfg/get_hostname string localhost
d-i netcfg/get_domain string local
# 禁用无线网络 WEP 弹窗提示
d-i netcfg/wireless_wep string


### 3. 镜像软件源设置 (Mirror settings)
# ------------------------------------------------------------------------------
# 手动指定远程镜像源
d-i mirror/country string manual
# 使用高性能的 xTom 香港镜像源，确保全球及亚洲 VPS 都能极速完成重装
d-i mirror/http/hostname string mirror.xtom.com.hk
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string


### 4. 账户与密码设置 (Account setup)
# ------------------------------------------------------------------------------
# 开启并允许超级管理员 Root 登录
d-i passwd/root-login boolean true
# 禁用普通用户创建，保持系统精简纯净，仅留 Root 账户
d-i passwd/make-user boolean false
# 设定超级管理员正式密码为：PassWord
d-i passwd/root-password password PassWord
d-i passwd/root-password-again password PassWord


### 5. 时钟与时区设置 (Clock and time zone)
# ------------------------------------------------------------------------------
# 硬件时钟使用万能的 UTC 时间（与绝大多数 VPS 母鸡硬件保持时线一致）
d-i clock-setup/utc boolean true
# 时区设定为 UTC 时间，避免因跨区域重装导致的时差混乱
d-i time/zone string UTC
# 开启网络时间协议 (NTP) 自动对时
d-i clock-setup/ntp boolean true


### Partitioning

d-i partman-auto/method string regular

# 删除旧的 LVM/RAID
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true

d-i partman-md/device_remove_md boolean true
d-i partman-md/confirm boolean true
d-i partman-md/confirm_nooverwrite boolean true

# 自定义单分区方案（无 swap）
d-i partman-auto/expert_recipe string \
    noswap :: \
        1000 10000 -1 ext4 \
            $primary{ } \
            method{ format } format{ } \
            use_filesystem{ } filesystem{ ext4 } \
            mountpoint{ / } \
        .

d-i partman-auto/choose_recipe select noswap

# 自动写入新的分区表
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true


### 7. 底层与预装软件选择 (Package selection)
# ------------------------------------------------------------------------------
# 禁用本地光盘检测
d-i apt-setup/cdrom/set-first boolean false
# 允许安装非开源固件驱动，规避某些独立服务器因缺失网卡驱动导致失联的风险
d-i apt-setup/non-free-firmware boolean true
# 精简系统组件：仅勾选标准系统环境与基本的 SSH 服务（拒绝任何桌面污染）
tasksel tasksel/first multiselect standard, ssh-server
# 一步到位预装你指定的常用运维工具、Nginx、Certbot 以及 ZRAM 驱动
d-i pkgsel/include string openssh-server sudo curl wget vim unzip zip htop tmux tree lsof nginx certbot python3-certbot-nginx whois cron mtr-tiny iputils-ping procps socat zram-tools
# 安装过程中顺便将所有包升级至最新稳定版本
d-i pkgsel/upgrade select full-upgrade


### 8. 引导程序安装 (Boot loader)
# ------------------------------------------------------------------------------
# 自动将 GRUB 引导主程序安装至默认主硬盘中
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default


### 9. 结束安装并重启 (Finishing up)
# ------------------------------------------------------------------------------
# 安装完成后不暂停提示，直接进行冷重启，无缝切换到新系统
d-i finish-install/reboot_in_progress note


### 10. 高级后置脚本：开启 SSH Root 密码登录 (Custom commands)
# 核心盲装补丁：Debian 默认禁止 SSH 远程用 Root 密码登录。
# 下面这一行命令会在重装完、重启前的临界点，强行修改新系统的 sshd_config，允许 Root 登录和密码认证。
d-i preseed/late_command string in-target sed -i 's/^#\?PermitRootLogin .*/PermitRootLogin yes/' /etc/ssh/sshd_config; in-target sed -i 's/^#\?PasswordAuthentication .*/PasswordAuthentication yes/' /etc/ssh/sshd_config

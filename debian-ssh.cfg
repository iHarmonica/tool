### 1. 语言与中文支持 (Localization)
# ------------------------------------------------------------------------------
# 默认系统内部语言使用英文，防止终端报错时乱码
d-i debian-installer/locale string en_US.UTF-8
# 额外生成中文环境支持，开启中文 SSH 支持，防止中文文件名或日志显示乱码
d-i localechooser/supported-locales multiselect en_US.UTF-8, zh_CN.UTF-8
# 设定标准美式键盘映射
d-i keyboard-configuration/xkb-keymap select us

### 2. 网络配置 (Network configuration)
# ------------------------------------------------------------------------------
# 自动选择有网络信号的物理网卡联网 (DHCP 自动获取 IP)
d-i netcfg/choose_interface select auto
# 强制设定系统主机名为 localhost，domain 设定为空字符串
d-i netcfg/get_hostname string localhost
d-i netcfg/get_domain string ""
# 禁用无线网络 WEP 弹窗提示
d-i netcfg/wireless_wep string

### 3. 镜像软件源设置 (Mirror settings)
# ------------------------------------------------------------------------------
# 手动指定远程镜像源
d-i mirror/country string manual
# 使用高性能的 xTom 香港镜像源，确保全球及亚洲 VPS 都能极速完成重装
d-i mirror/http/hostname string mirror.xtom.com.hk
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### 4. 核心：开启网络控制台 (Network Console)
# 告诉安装程序：加载网络控制台模块
d-i anna/choose_modules string network-console
# 设置远程连接到安装界面时，需要输入的临时 SSH 密码（例如设为：PassWord）
d-i network-console/password password PassWord
d-i network-console/password-again password PassWord
# 在本地电脑上“围观并接管”安装
# 注意：用户名必须是固定的 installer，而不是 root！
# ssh installer@154.31.157.121

### 5. 账户与密码设置 (Account setup)
# ------------------------------------------------------------------------------
# 开启并允许超级管理员 Root 登录
d-i passwd/root-login boolean true
# 禁用普通用户创建，保持系统精简纯净，仅留 Root 账户
d-i passwd/make-user boolean false
# 设定超级管理员正式密码为：PassWord
d-i passwd/root-password password PassWord
d-i passwd/root-password-again password PassWord


### 6. 时钟与时区设置 (Clock and time zone)
# ------------------------------------------------------------------------------
# 硬件时钟使用万能的 UTC 时间（与绝大多数 VPS 母鸡硬件保持时线一致）
d-i clock-setup/utc boolean true
# 时区设定为中国标准时区
d-i time/zone string Asia/Singapore
# 开启网络时间协议 (NTP) 自动对时
d-i clock-setup/ntp boolean true
